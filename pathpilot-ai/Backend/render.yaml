services:
  - type: web
    name: pathpilot-ai-backend
    runtime: python
    region: singapore  # closest to India; change to "ohio" for US East
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: FRONTEND_ORIGIN
        sync: false   # Set to your Vercel URL after deploying frontend
      - key: APP_ENV
        value: production
      - key: MAX_GENERATIONS_PER_HOUR
        value: "10"
      - key: AI_TIMEOUT_SECONDS
        value: "60"
      - key: PYTHON_VERSION
        value: "3.12.0"
